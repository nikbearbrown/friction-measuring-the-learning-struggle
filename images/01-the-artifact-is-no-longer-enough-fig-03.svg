<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-03">
  <title id="fig-title-03">The right question</title>
  <desc>Two questions diverge. "Did a human type this?" is a property of the artifact and is defeatable. "Did a human learn this?" is a property of the student, evidenced by behavioral traces an AI cannot produce on her behalf.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="01-the-artifact-is-no-longer-enough" figure-number="03" figure-title="The right question" figure-slug="the-right-question" figure-type="Conceptual map" priority="Critical" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/01-the-artifact-is-no-longer-enough-cajal.md"/>
  </metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="32" y="42" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">The right question</text>
  <text x="32" y="62" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">A property of the artifact versus a property of the student.</text>

  <!-- divider -->
  <line x1="350" y1="84" x2="350" y2="356" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>

  <!-- left side: the defeatable question -->
  <text x="40" y="106" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" letter-spacing="0.04em">DETECTION ASKS</text>
  <rect x="40" y="118" width="270" height="58" fill="#FFFFFF" stroke="#787878" stroke-width="1"/>
  <text x="175" y="143" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="13" fill="#2a1a0e">"Did a human type this?"</text>
  <text x="175" y="161" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">a property of the artifact</text>

  <line x1="175" y1="176" x2="175" y2="220" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="226" width="270" height="48" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="175" y="255" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Defeated by any human-looking text</text>

  <!-- right side: the durable question -->
  <text x="390" y="106" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" letter-spacing="0.04em">THE FRAMEWORK ASKS</text>
  <rect x="390" y="118" width="270" height="58" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/>
  <text x="525" y="143" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="13" fill="#C8102E" font-weight="600">"Did a human learn this?"</text>
  <text x="525" y="161" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">a property of the student</text>

  <line x1="525" y1="176" x2="525" y2="220" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="390" y="226" width="270" height="48" fill="#FFFFFF" stroke="#C8102E" stroke-width="1"/>
  <text x="525" y="248" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Evidenced by behavioral traces</text>
  <text x="525" y="265" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">the AI cannot supply on her behalf</text>

  <!-- shared takeaway -->
  <rect x="150" y="306" width="400" height="48" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="350" y="330" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Performance vs. learning (Bjork &amp; Soderstrom)</text>
  <text x="350" y="347" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">the gap assessment was never built to handle</text>

  <line x1="175" y1="274" x2="330" y2="308" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="525" y1="274" x2="370" y2="308" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="32" y="392" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">No system can defeat the second question, because no system can cause the student to learn.</text>
