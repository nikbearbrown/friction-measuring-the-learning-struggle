  <title id="fig-title-04">The genuine signature and the borrowed one</title>
  <desc>Genuine engagement leaves time bunched on hard items, re-reading, backtracking, and clustered pauses; borrowed certainty flattens the profile with linear production and thinning pauses. The signal is probabilistic, a flag not a verdict.</desc>
