<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-01">
  <title id="fig-title-01">Which components to start with</title>
  <desc>An accessibility ladder ordering seven components from easiest to hardest to implement, with the recommendation to pick the two your current infrastructure already supports.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="11-building-your-second-evidence-stream" figure-number="01" figure-title="Which components to start with" figure-slug="which-components-to-start-with" figure-type="Conceptual map" priority="Critical" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/11-building-your-second-evidence-stream-cajal.md"/>
  </metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="32" y="40" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">The accessibility ladder: start where your infrastructure already reaches</text>
  <text x="32" y="60" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Order by cost to implement, not by theoretical importance</text>

  <!-- Vertical ladder arrow, easiest top -->
  <text x="40" y="84" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#C8102E">easiest — start here</text>
  <line x1="48" y1="96" x2="48" y2="384" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="40" y="402" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">hardest</text>

  <!-- Rungs: each component with infra + time. baseline rows -->
  <!-- Row 1 Y4 (highlighted as a start pick) -->
  <rect x="80" y="76" width="588" height="40" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="92" y="93" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">Y4 Uncertainty Calibration</text>
  <text x="92" y="109" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">one confidence question per quiz item — a gradebook column — first data in one quiz</text>

  <!-- Row 2 Y5-lite (highlighted) -->
  <rect x="80" y="120" width="588" height="40" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="92" y="137" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">Y5-lite Confusion Notes</text>
  <text x="92" y="153" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">"what confused you most?" paragraph — a submission field — first data in one assignment</text>

  <!-- Row 3 Y6 -->
  <rect x="80" y="164" width="588" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="92" y="181" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">Y6 Retrieval Strength Decay</text>
  <text x="92" y="197" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">embed prior-unit items, unannounced — a tagged question bank — data in 3 to 4 weeks</text>

  <!-- Row 4 Y3 -->
  <rect x="80" y="208" width="588" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="92" y="225" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">Y3 Cross-Context Transfer</text>
  <text x="92" y="241" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">one near- and one far-transfer item per concept — assessment design — moderate complexity</text>

  <!-- Row 5 Y1 -->
  <rect x="80" y="252" width="588" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="92" y="269" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">Y1 Temporal Engagement</text>
  <text x="92" y="285" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">checkmark/question-mark annotations vs. difficulty — without an LMS, only approximable</text>

  <!-- Row 6 Y2 -->
  <rect x="80" y="296" width="588" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="92" y="313" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">Y2 Error Trajectory Coherence</text>
  <text x="92" y="329" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">code errors by misconception type — needs a misconception taxonomy — high complexity</text>

  <!-- Row 7 Y7 -->
  <rect x="80" y="340" width="588" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="92" y="357" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">Y7 Scaffolding Response</text>
  <text x="92" y="373" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">a two-level hint pair per concept — easy with individual contact, hard in large lectures</text>

  <text x="80" y="402" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" font-style="italic">Most readers find two components very accessible in current practice. Pick those two (highlighted).</text>
</svg>
