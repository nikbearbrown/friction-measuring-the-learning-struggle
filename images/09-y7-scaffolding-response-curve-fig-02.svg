<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-02">
  <title id="fig-title-02">Where the framework comes from</title>
  <desc>Top-down lineage: Vygotsky's Zone of Proximal Development gives rise to scaffolding (contingent, fading, transferring) and dynamic assessment, which feed the Y7 hint-response measurement; prosthesis is the contrast case.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="09-y7-scaffolding-response-curve" figure-number="02" figure-title="Where the framework comes from" figure-slug="where-the-framework-comes-from" figure-type="Hierarchy / taxonomy" priority="Critical" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/09-y7-scaffolding-response-curve-cajal.md"/>
  </metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>

  <!-- root: ZPD -->
  <rect x="250" y="44" width="200" height="58" fill="#F5F5F5" stroke="#C8102E" stroke-width="1.5"/>
  <text x="350" y="68" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">Zone of Proximal</text>
  <text x="350" y="86" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">Development</text>
  <text x="350" y="116" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Vygotsky, ~1930 — the distance where guidance is still productive</text>

  <!-- two children -->
  <rect x="100" y="160" width="220" height="72" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="210" y="182" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#2a1a0e">Scaffolding</text>
  <text x="210" y="198" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10.5" fill="#545454">Wood, Bruner, Ross 1976</text>
  <text x="210" y="216" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10.5" fill="#2a1a0e">contingent - fades - transfers</text>

  <rect x="380" y="160" width="220" height="72" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="490" y="182" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#2a1a0e">Dynamic Assessment</text>
  <text x="490" y="198" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10.5" fill="#545454">Feuerstein, 1950s-60s</text>
  <text x="490" y="216" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10.5" fill="#2a1a0e">score response to mediation</text>

  <line x1="320" y1="102" x2="225" y2="158" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="102" x2="475" y2="158" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- converge to Y7 -->
  <rect x="250" y="280" width="200" height="64" fill="#F5F5F5" stroke="#C8102E" stroke-width="1.5"/>
  <text x="350" y="304" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#2a1a0e">Y7 hint-response</text>
  <text x="350" y="322" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#2a1a0e">measurement</text>
  <text x="350" y="338" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#C8102E">partial hint tests for a developing region</text>

  <line x1="225" y1="232" x2="320" y2="278" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="232" x2="380" y2="278" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- contrast: prosthesis -->
  <rect x="500" y="296" width="168" height="48" fill="#FFFFFF" stroke="#545454" stroke-width="1"/>
  <text x="584" y="316" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="12" fill="#545454">Prosthesis (Pea 2004)</text>
  <text x="584" y="332" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454">held up; take it away, she falls</text>
  <line x1="452" y1="318" x2="498" y2="318" stroke="#545454" stroke-width="1" stroke-dasharray="5 4"/>

  <text x="350" y="380" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">You cannot tell from how help was offered whether it was scaffolding —</text>
  <text x="350" y="398" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">only from what the learner did with it.</text>
