  <!-- Bottom note -->
  <line x1="32" y1="356" x2="668" y2="356" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="380" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Not a formula — a map for where to look first. The instructor knows the tier of work better than any</text>
  <text x="32" y="398" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">specification can predict, so tier calibration belongs to her judgment, not to an automated weighting.</text>
  <text x="32" y="416" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" font-style="italic">Weights are illustrative of relative emphasis, not validated empirical loadings.</text>
