  <text x="100" y="364" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">F: genuine, almost flat — no concern.  G: artifacts look fine, legacy collapses — the gradebook concealed it.</text>
