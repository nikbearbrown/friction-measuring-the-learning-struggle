<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04">
  <title id="fig-title-04">Reading trajectories without a platform</title>
  <desc>A conceptual map of the low-cost practitioner workflow: build a short misconception category list once, code each set of papers in minutes, then read three trajectory patterns across assessments — moving coherently, coherent but stuck, or scattered — each pointing to a different teaching response.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="04-y2-error-trajectory-coherence" figure-number="04" figure-title="Reading trajectories without a platform" figure-slug="reading-trajectories-without-a-platform" figure-type="Conceptual map" priority="Important" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/04-y2-error-trajectory-coherence-cajal.md"/>
  </metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="32" y="40" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Reading trajectories without a platform</text>
  <text x="32" y="60" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Build the category list once, code papers in minutes, then read three trajectory patterns — each one points to a response.</text>

  <!-- Step nodes (workflow on left) -->
  <rect x="32" y="92" width="200" height="48" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="132" y="113" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Build the list (once)</text>
  <text x="132" y="130" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">4–6 generator-level categories</text>

  <rect x="32" y="156" width="200" height="48" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="132" y="177" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Code each set</text>
  <text x="132" y="194" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">one column per assessment</text>

  <line x1="132" y1="140" x2="132" y2="154" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="232" y1="180" x2="280" y2="180" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Three pattern outcomes (right) -->
  <rect x="288" y="92" width="380" height="58" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="304" y="115" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Moving coherently</text>
  <text x="304" y="133" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">category shifts to adjacent → the mechanism is working; keep going</text>

  <rect x="288" y="160" width="380" height="58" fill="#FFFFFF" stroke="#C8860E" stroke-width="1"/>
  <text x="304" y="183" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Coherent but stuck</text>
  <text x="304" y="201" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">same category, every time → targeted teaching on the stuck concept</text>

  <rect x="288" y="228" width="380" height="58" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="304" y="251" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#C8102E" font-weight="600">Scattered</text>
  <text x="304" y="269" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">no clustering, no transitions → flag for a closer conversation</text>

  <!-- coding feeds all three -->
  <line x1="232" y1="180" x2="284" y2="121" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <line x1="232" y1="190" x2="284" y2="189" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <line x1="232" y1="200" x2="284" y2="257" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>

  <line x1="32" y1="322" x2="668" y2="322" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="344" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">The spreadsheet is not a verdict. It is a structured reading that directs the teacher toward the right conversation.</text>
  <text x="32" y="370" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" letter-spacing="0.04em">LIMITING CONDITION</text>
  <text x="32" y="388" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Building the category list is the expensive step; once it exists, per-assessment cost drops to a few minutes per student.</text>
  <text x="32" y="408" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Reader takeaway: no platform required — a class set of papers and a four-category list are enough to read the trajectory.</text>
</svg>
