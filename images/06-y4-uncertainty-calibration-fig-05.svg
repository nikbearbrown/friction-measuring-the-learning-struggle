  <line x1="32" y1="324" x2="668" y2="324" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="346" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" letter-spacing="0.04em">LIMITING CONDITION</text>
  <text x="32" y="364" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Worsening calibration is more diagnostic than the absolute gap — it indicates a process moving in the wrong direction.</text>
  <text x="32" y="388" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Reader takeaway: the platform is useful at scale, but every addition rests on the same one-line question. The signal exists without it.</text>
