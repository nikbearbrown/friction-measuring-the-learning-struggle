<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-05">
  <title id="fig-title-05">What a platform adds</title>
  <desc>A conceptual map showing that the bare confidence question already yields the Y4 signal, while a platform layers on automated Brier scores, a continuous trajectory plot, between-student normalization, early worsening alerts, and an ensemble Y4 number. The platform helps at scale; the signal exists without it.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="06-y4-uncertainty-calibration" figure-number="05" figure-title="What a platform adds" figure-slug="what-a-platform-adds" figure-type="Conceptual map" priority="Important" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/06-y4-uncertainty-calibration-cajal.md"/>
  </metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="32" y="40" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">What a platform adds</text>
  <text x="32" y="60" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">The confidence question already produces the signal. A platform layers automation on top of it — useful at scale.</text>

  <!-- Base node (left): the question, signal exists -->
  <rect x="32" y="160" width="180" height="92" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="122" y="190" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#C8102E" font-weight="600">The confidence</text>
  <text x="122" y="207" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#C8102E" font-weight="600">question</text>
  <text x="122" y="227" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">one line, spreadsheet —</text>
  <text x="122" y="242" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">the signal exists here</text>

  <!-- Five platform additions on right -->
  <rect x="318" y="92" width="350" height="34" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="332" y="114" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Automated Brier scores across many quizzes</text>

  <rect x="318" y="134" width="350" height="34" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="332" y="156" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Continuous calibration trajectory plot</text>

  <rect x="318" y="176" width="350" height="34" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="332" y="198" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Between-student normalization</text>

  <rect x="318" y="218" width="350" height="34" fill="#FFFFFF" stroke="#C8860E" stroke-width="1.2"/>
  <text x="332" y="240" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Early alert: calibration worsening</text>

  <rect x="318" y="260" width="350" height="34" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="332" y="282" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Y4 in the seven-signal ensemble</text>

