<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-03">
  <title id="fig-title-03">The genuine signature and the borrowed one</title>
  <desc>A conceptual map contrasting the two calibration signatures. Genuine engagement: confidence tracks knowledge, discrimination grows, calibration improves over the term. Borrowed certainty: uniformly high confidence, near-zero discrimination, no improvement because the fluency illusion deepens with AI use.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="06-y4-uncertainty-calibration" figure-number="03" figure-title="The genuine signature and the borrowed one" figure-slug="the-genuine-signature-and-the-borrowed-one" figure-type="Conceptual map" priority="Critical" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/06-y4-uncertainty-calibration-cajal.md"/>
  </metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="32" y="40" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">The genuine signature and the borrowed one</text>
  <text x="32" y="60" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">The longitudinal trend is the signal: genuine calibration improves over the term; borrowed certainty holds or widens.</text>

  <!-- Genuine column -->
  <rect x="32" y="92" width="300" height="232" fill="#F5F5F5" stroke="#C8102E" stroke-width="1.5"/>
  <text x="182" y="116" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#C8102E" font-weight="600">Genuine engagement</text>

  <rect x="52" y="132" width="260" height="36" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="62" y="155" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Confidence tracks knowledge, item by item</text>

  <rect x="52" y="176" width="260" height="36" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="62" y="199" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Low on hard items, high on easy ones</text>

  <rect x="52" y="220" width="260" height="36" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="62" y="243" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Discrimination index grows over weeks</text>

  <rect x="52" y="264" width="260" height="40" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="62" y="288" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#C8102E" font-weight="600">Calibration improves over the term</text>

  <!-- Borrowed column -->
  <rect x="368" y="92" width="300" height="232" fill="#F5F5F5" stroke="#545454" stroke-width="1.5"/>
  <text x="518" y="116" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Borrowed certainty</text>

  <rect x="388" y="132" width="260" height="36" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="398" y="155" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Confidence high regardless of difficulty</text>

  <rect x="388" y="176" width="260" height="36" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="398" y="199" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Fluency cue does all the work</text>

  <rect x="388" y="220" width="260" height="36" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="398" y="243" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Discrimination index near zero</text>

  <rect x="388" y="264" width="260" height="40" fill="#FFFFFF" stroke="#545454" stroke-width="1.5"/>
  <text x="398" y="288" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e" font-weight="600">Gap holds or widens over the term</text>

  <!-- arrows pointing down within each column to emphasize trajectory -->
  <line x1="182" y1="168" x2="182" y2="174" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="182" y1="212" x2="182" y2="218" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="182" y1="256" x2="182" y2="262" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <line x1="32" y1="340" x2="668" y2="340" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="362" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Discrimination index = mean confidence on correct items minus mean confidence on wrong ones.</text>
  <text x="32" y="380" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" letter-spacing="0.04em">A FAILURE MODE TO READ SEPARATELY</text>
  <text x="32" y="398" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">A student calibrated to low knowledge has genuine Y4 and may still be failing — metacognition and content are two separate axes.</text>
</svg>
