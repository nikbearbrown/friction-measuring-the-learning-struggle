<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04">
  <title id="fig-title-04">What the two signatures look like</title>
  <desc>Three response patterns to a partial hint: genuine partial understanding (fast independent progress, integrates), borrowed certainty (stares, needs full hint, stuck again next time), and the slow responder who is still genuine after a longer wait.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="09-y7-scaffolding-response-curve" figure-number="04" figure-title="What the two signatures look like" figure-slug="what-the-two-signatures-look-like" figure-type="Conceptual map" priority="Important" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/09-y7-scaffolding-response-curve-cajal.md"/>
  </metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>

  <text x="350" y="44" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">Same partial hint offered — three responses</text>

  <!-- genuine -->
  <rect x="32" y="62" width="200" height="296" fill="#F5F5F5" stroke="#C8102E" stroke-width="1.5"/>
  <text x="132" y="88" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#2a1a0e">Genuine partial</text>
  <text x="132" y="105" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#2a1a0e">understanding</text>
  <line x1="52" y1="118" x2="212" y2="118" stroke="#D4D4D4" stroke-width="0.75"/>
  <text x="52" y="144" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Quiet, then writes — fast</text>
  <text x="52" y="168" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Hint reorganizes the work</text>
  <text x="52" y="192" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">New errors, not old ones</text>
  <text x="52" y="216" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Next problem: no hint</text>
  <rect x="52" y="290" width="160" height="50" fill="#FFFFFF" stroke="#C8102E" stroke-width="1"/>
  <text x="132" y="310" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#C8102E">ratio ~ 1</text>
  <text x="132" y="328" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10.5" fill="#2a1a0e">integration positive</text>

  <!-- slow responder (middle, still genuine) -->
  <rect x="250" y="62" width="200" height="296" fill="#F5F5F5" stroke="#C8102E" stroke-width="1"/>
  <text x="350" y="88" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#2a1a0e">Slow responder</text>
  <text x="350" y="105" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#C8102E">still genuine</text>
  <line x1="270" y1="118" x2="430" y2="118" stroke="#D4D4D4" stroke-width="0.75"/>
  <text x="270" y="144" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Sits in silence ~90 s</text>
  <text x="270" y="168" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Then moves on her own</text>
  <text x="270" y="192" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Region just needs more</text>
  <text x="270" y="208" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">activation time</text>
  <text x="270" y="240" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Wait, do not escalate.</text>
  <rect x="270" y="290" width="160" height="50" fill="#FFFFFF" stroke="#C8102E" stroke-width="1"/>
  <text x="350" y="310" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10.5" fill="#2a1a0e">test is independent progress</text>
  <text x="350" y="328" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10.5" fill="#2a1a0e">at all — not immediacy</text>

  <!-- borrowed -->
  <rect x="468" y="62" width="200" height="296" fill="#FFFFFF" stroke="#545454" stroke-width="1"/>
  <text x="568" y="88" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#545454">Borrowed certainty</text>
  <line x1="488" y1="118" x2="648" y2="118" stroke="#D4D4D4" stroke-width="0.75"/>
  <text x="488" y="144" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Stares; no engagement</text>
  <text x="488" y="168" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">"Can you just show me</text>
  <text x="488" y="184" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">how to set it up?"</text>
  <text x="488" y="208" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Tracks the full hint</text>
  <text x="488" y="232" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Next problem: stuck again</text>
  <rect x="488" y="290" width="160" height="50" fill="#F5F5F5" stroke="#545454" stroke-width="1"/>
  <text x="568" y="310" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">ratio ~ 0</text>
  <text x="568" y="328" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10.5" fill="#545454">integration absent</text>

  <text x="350" y="386" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">The most common mistake is reading the slow responder as borrowed certainty. Silence is not absence —</text>
  <text x="350" y="404" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">the test is whether it eventually resolves into independent movement.</text>
</svg>
