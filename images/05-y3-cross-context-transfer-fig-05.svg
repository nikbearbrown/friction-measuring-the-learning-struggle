<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-05">
  <title id="fig-title-05">How to observe this without any new infrastructure</title>
  <desc>Side-by-side comparison panels of two low-cost ways to read the transfer gap. Left: a paired-item quiz holds the principle constant and varies the cover story, scoring near and far separately. Right: the Chi sort task lets students group problems, revealing whether they sort by cover story or by underlying principle.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="05-y3-cross-context-transfer" figure-number="05" figure-title="How to observe this without any new infrastructure" figure-slug="how-to-observe-this-without-any-new-infrastructure" figure-type="Comparison panels" priority="Important" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/05-y3-cross-context-transfer-cajal.md"/>
  </metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="32" y="40" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">How to observe this without any new infrastructure</text>
  <text x="32" y="60" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Two methods, same shared axis: does the student respond to the surface, or to the principle underneath it?</text>

  <!-- Shared reference axis label -->
  <text x="350" y="84" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" letter-spacing="0.06em">SHARED AXIS — SURFACE FEATURES  vs.  UNDERLYING PRINCIPLE</text>

  <!-- LEFT PANEL: paired-item quiz -->
  <rect x="32" y="100" width="300" height="240" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
  <text x="182" y="124" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Paired-item quiz</text>

  <rect x="56" y="142" width="252" height="44" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="66" y="162" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Near item — textbook cover story</text>
  <text x="66" y="178" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">scored: 82%</text>

  <rect x="56" y="200" width="252" height="44" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="66" y="220" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Far item — re-clothed, new domain</text>
  <text x="66" y="236" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#C8102E">scored: 51%</text>

  <line x1="182" y1="186" x2="182" y2="198" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="182" y="276" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">gap = 31 points → measured</text>
  <text x="182" y="312" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">cheapest: two items per concept,</text>
  <text x="182" y="328" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">existing quiz format</text>

  <!-- RIGHT PANEL: Chi sort task -->
  <rect x="368" y="100" width="300" height="240" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="0.75"/>
  <text x="518" y="124" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Chi sort task</text>

  <rect x="392" y="142" width="252" height="44" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="402" y="162" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Groups by cover story (pulleys)</text>
  <text x="402" y="178" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">novice signature</text>

  <rect x="392" y="200" width="252" height="44" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="402" y="220" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Groups by principle (energy)</text>
  <text x="402" y="236" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#C8102E">schema present</text>

  <text x="518" y="276" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">sort reveals which axis → read</text>
  <text x="518" y="312" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">15 minutes, no grading,</text>
  <text x="518" y="328" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">whole class at once</text>

  <line x1="32" y1="356" x2="668" y2="356" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="378" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Also available: cold-call recognition probe (embed the principle, don't name it) and cross-discipline retrieval prompt.</text>
  <text x="32" y="402" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Reader takeaway: score Y3 as a continuum — a student who transfers with one nudge shows more schema than one who needs the whole answer.</text>
</svg>
