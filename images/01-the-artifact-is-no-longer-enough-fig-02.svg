  <text x="32" y="42" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Why detection is not the answer</text>
  <text x="32" y="62" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">One flawed question spawns four structural dead ends.</text>

  <!-- central node -->
  <rect x="265" y="186" width="170" height="62" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/>
  <text x="350" y="212" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#C8102E" font-weight="600">"Did a human</text>
  <text x="350" y="230" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#C8102E" font-weight="600">type this?"</text>

  <!-- four problem nodes around it -->
  <!-- top-left -->
  <rect x="40" y="92" width="200" height="58" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="140" y="116" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">A losing arms race</text>
  <text x="140" y="134" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">accuracy → coin flip</text>

  <!-- top-right -->
  <rect x="460" y="92" width="200" height="58" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="560" y="116" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">The wrong question</text>
  <text x="560" y="134" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">typed ≠ learned</text>

  <!-- bottom-left -->
  <rect x="40" y="284" width="200" height="58" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="140" y="308" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">False positives</text>
  <text x="140" y="326" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">flags non-native writers</text>

  <!-- bottom-right -->
  <rect x="460" y="284" width="200" height="58" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="560" y="308" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Perverse incentive</text>
  <text x="560" y="326" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">teaches laundering</text>

