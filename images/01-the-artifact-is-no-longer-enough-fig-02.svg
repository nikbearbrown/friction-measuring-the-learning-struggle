  <title id="fig-title-02">Why detection is not the answer</title>
  <desc>Detection asks "did a human type this?" Four structural failures radiate from that question: a losing arms race, the wrong question, false positives on non-native writers, and a perverse incentive that teaches laundering instead of learning.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="01-the-artifact-is-no-longer-enough" figure-number="02" figure-title="Why detection is not the answer" figure-slug="why-detection-is-not-the-answer" figure-type="Conceptual map" priority="Critical" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/01-the-artifact-is-no-longer-enough-cajal.md"/>
