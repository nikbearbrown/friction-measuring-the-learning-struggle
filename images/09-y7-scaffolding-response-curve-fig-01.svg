<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-01">
  <title id="fig-title-01">The measurement</title>
  <desc>Y7 measures two things: the ratio of gain from a partial hint to gain from a full hint, and whether the hint integrates so it is not needed on the next problem of the same type.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="09-y7-scaffolding-response-curve" figure-number="01" figure-title="The measurement" figure-slug="the-measurement" figure-type="Conceptual map" priority="Critical" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/09-y7-scaffolding-response-curve-cajal.md"/>
  </metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>

  <text x="350" y="48" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">Two numbers are the whole methodology</text>

  <!-- measure 1: the ratio -->
  <rect x="48" y="74" width="280" height="150" fill="#F5F5F5" stroke="#C8102E" stroke-width="1.5"/>
  <text x="188" y="100" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#2a1a0e">1. The ratio</text>
  <rect x="72" y="116" width="232" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="188" y="134" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">gain from partial hint</text>
  <line x1="100" y1="142" x2="276" y2="142" stroke="#2a1a0e" stroke-width="1"/>
  <text x="188" y="152" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">gain from full hint</text>
  <text x="72" y="186" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#C8102E">~1: developing region is real</text>
  <text x="72" y="206" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">~0: only the full answer works</text>

  <!-- measure 2: integration -->
  <rect x="372" y="74" width="280" height="150" fill="#F5F5F5" stroke="#C8102E" stroke-width="1.5"/>
  <text x="512" y="100" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#2a1a0e">2. The integration probe</text>
  <text x="392" y="128" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11.5" fill="#2a1a0e">Next problem of the same type:</text>
  <text x="392" y="148" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11.5" fill="#2a1a0e">is the hint needed again?</text>
  <text x="392" y="180" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#C8102E">No: integrated (learned)</text>
  <text x="392" y="200" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Yes: consumed, not integrated</text>

  <!-- outcomes -->
  <rect x="48" y="252" width="280" height="76" fill="#FFFFFF" stroke="#C8102E" stroke-width="1"/>
  <text x="188" y="276" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#2a1a0e">Genuine partial understanding</text>
  <text x="188" y="298" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">partial hint sufficient,</text>
  <text x="188" y="314" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">not required next time</text>

  <rect x="372" y="252" width="280" height="76" fill="#FFFFFF" stroke="#545454" stroke-width="1"/>
  <text x="512" y="276" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="13" fill="#545454">Borrowed certainty</text>
  <text x="512" y="298" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">full hint required,</text>
  <text x="512" y="314" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">required again next time</text>

  <line x1="188" y1="224" x2="188" y2="250" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="512" y1="224" x2="512" y2="250" stroke="#545454" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="350" y="360" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">The signal is in the response to the help, not in the artifact the student eventually produces.</text>
  <text x="350" y="380" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">No platform required: a sentence in your office-hours notes records both numbers.</text>
</svg>
