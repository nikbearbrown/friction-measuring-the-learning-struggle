<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-01">
  <title id="fig-title-01">Two strengths, not one</title>
  <desc>The Bjork two-component model: retrieval strength (accessible now, fast to decay) versus storage strength (encoding depth, slow to build and decay). Maximizing one can suppress the other.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="08-y6-retrieval-strength-decay" figure-number="01" figure-title="Two strengths, not one" figure-slug="two-strengths-not-one" figure-type="Conceptual map" priority="Critical" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/08-y6-retrieval-strength-decay-cajal.md"/>
  </metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>

  <text x="350" y="52" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">Memory has two separate quantities</text>

  <!-- retrieval strength -->
  <rect x="48" y="80" width="280" height="180" fill="#FFFFFF" stroke="#545454" stroke-width="1"/>
  <text x="188" y="108" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">Retrieval strength</text>
  <text x="188" y="126" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">how accessible right now</text>
  <line x1="68" y1="142" x2="308" y2="142" stroke="#D4D4D4" stroke-width="0.75"/>
  <text x="68" y="166" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Sensitive to recency</text>
  <text x="68" y="190" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Spikes after review</text>
  <text x="68" y="214" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Decays fast</text>
  <text x="68" y="244" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Cramming maximizes this</text>

  <!-- storage strength -->
  <rect x="372" y="80" width="280" height="180" fill="#F5F5F5" stroke="#C8102E" stroke-width="1.5"/>
  <text x="512" y="108" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">Storage strength</text>
  <text x="512" y="126" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#C8102E">how thoroughly encoded</text>
  <line x1="392" y1="142" x2="632" y2="142" stroke="#D4D4D4" stroke-width="0.75"/>
  <text x="392" y="166" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Robustness of the trace</text>
  <text x="392" y="190" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Slow to build</text>
  <text x="392" y="214" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Slow to decay</text>
  <text x="392" y="244" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#C8102E">Spaced retrieval builds this</text>

  <!-- suppression arrow -->
  <path d="M 328 300 Q 350 280 372 300" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="296" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454">maximizing one</text>
  <text x="350" y="308" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454">can suppress the other</text>

  <!-- takeaway -->
  <rect x="48" y="330" width="604" height="56" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="350" y="354" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">The AI-assisted student lives in the retrieval-strength world: material is always</text>
  <text x="350" y="372" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">fluently in front of her, storage near zero. The delayed quiz is the honest number.</text>
</svg>
