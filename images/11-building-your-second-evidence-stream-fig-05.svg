<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-05">
  <title id="fig-title-05">A worked example: a community college instructor's first semester</title>
  <desc>A conceptual map of Maria's term: two chosen components (Y4 confidence, Y5-lite confusion notes) reveal two surprising patterns by week six, prompting two different non-adversarial conversations. She changed her teaching, not anyone's grade.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="11-building-your-second-evidence-stream" figure-number="05" figure-title="A worked example: a community college instructor's first semester" figure-slug="a-worked-example-a-community-college-instructors-first-semester" figure-type="Conceptual map" priority="Important" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/11-building-your-second-evidence-stream-cajal.md"/>
  </metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="32" y="40" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">Two components, two surprising patterns, two different conversations</text>
  <text x="32" y="60" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Composite English class: 26 students, 14 weeks. Transparency announced in week one (≈90 seconds).</text>

  <!-- Two component nodes -->
  <rect x="32" y="80" width="160" height="50" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="112" y="100" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">Y4 on weekly quizzes</text>
  <text x="112" y="118" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">confidence ratings</text>

  <rect x="32" y="146" width="160" height="50" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="112" y="166" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">Y5-lite per assignment</text>
  <text x="112" y="184" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">confusion notes</text>

  <!-- Arrow to week 6 reading -->
  <line x1="192" y1="138" x2="256" y2="138" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="262" y="108" width="120" height="60" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="322" y="132" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#C8102E">Week 6 read</text>
  <text x="322" y="150" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">profile vs essay</text>
  <text x="322" y="164" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">grade diverges</text>

  <!-- Two patterns -> two conversations -->
  <line x1="382" y1="124" x2="446" y2="104" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="382" y1="152" x2="446" y2="216" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Pattern A: strong essay, generic notes -->
  <rect x="452" y="76" width="216" height="74" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="462" y="96" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">2 students: strong essays,</text>
  <text x="462" y="112" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">flatly generic confusion notes</text>
  <text x="462" y="132" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">→ ask about their reading process,</text>
  <text x="462" y="146" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">as genuine inquiry, not accusation</text>

  <!-- Pattern B: weak essay, textured notes -->
  <rect x="452" y="188" width="216" height="74" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="462" y="208" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">3 students: weaker essays,</text>
  <text x="462" y="224" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">specific, textured confusions</text>
  <text x="462" y="244" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">→ invite to office hours; engagement</text>
  <text x="462" y="258" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">is there, the essay is the bottleneck</text>

  <!-- Outcome -->
  <line x1="32" y1="296" x2="668" y2="296" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="322" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">By end of term the patterns held: generic-note students matched her concerns; textured-note students</text>
  <text x="32" y="340" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">improved once she targeted revision support.</text>

  <rect x="160" y="356" width="380" height="40" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="350" y="381" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#C8102E">She changed no one's grade. She changed her teaching.</text>

  <text x="32" y="414" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" font-style="italic">A composite drawn from published formative-assessment work; plausible, not yet a citable field deployment.</text>
</svg>
