  <!-- Bottom note -->
  <line x1="32" y1="320" x2="668" y2="320" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="346" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">The two picks differ by context because the bias and infrastructure differ. In a lecture, Y4 and Y5-lite</text>
  <text x="32" y="364" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">suffer low response rates and self-selection; Y6 and Y3 arrive inside quizzes students take because they count.</text>
  <text x="32" y="392" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" font-style="italic">The triage logic is identical across all three: read the ladder, pick the two your infrastructure supports, start there.</text>
