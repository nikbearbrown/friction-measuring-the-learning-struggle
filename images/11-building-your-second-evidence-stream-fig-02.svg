  <title id="fig-title-02">Starting points for three contexts</title>
  <desc>A conceptual map: three teaching contexts each map to two recommended starting components — high school science to Y4 and Y5-lite, lecture-and-section to Y6 and Y3, clinical education to Y7 and full Y5.</desc>
