  <title id="fig-title-03">Why the gross number fooled us for so long</title>
  <desc>Allocated time contains engaged time, which contains academic learning time. The innermost band is the real predictor of learning but the hardest to log; the outermost is easiest to log, so dashboards measured it and AI now lives in the gap.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="03-y1-temporal-engagement-pattern" figure-number="03" figure-title="Why the gross number fooled us for so long" figure-slug="why-the-gross-number-fooled-us-for-so-long" figure-type="Conceptual map" priority="Critical" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/03-y1-temporal-engagement-pattern-cajal.md"/>
