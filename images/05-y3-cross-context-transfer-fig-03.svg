<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-03">
  <title id="fig-title-03">Why borrowed certainty fails on far transfer specifically</title>
  <desc>A conceptual map showing that LLMs are pattern-matchers, so a student who absorbs an AI answer inherits surface-level competence but no schema. Near transfer survives because the pattern still applies; far transfer exposes the missing structure, and faking it would require the very schema the borrowing bypassed.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="05-y3-cross-context-transfer" figure-number="03" figure-title="Why borrowed certainty fails on far transfer specifically" figure-slug="why-borrowed-certainty-fails-on-far-transfer-specifically" figure-type="Conceptual map" priority="Critical" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/05-y3-cross-context-transfer-cajal.md"/>
  </metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="32" y="40" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Why borrowed certainty fails on far transfer</text>
  <text x="32" y="60" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">A pattern-match survives the near probe and breaks on the far one — because faking far transfer requires the missing schema.</text>

  <!-- Source node -->
  <rect x="270" y="92" width="160" height="56" fill="#FFFFFF" stroke="#545454" stroke-width="1.5"/>
  <text x="350" y="116" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">LLM pattern-match</text>
  <text x="350" y="133" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">surface-level competence</text>

  <!-- inherited by student -->
  <rect x="270" y="172" width="160" height="48" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="350" y="193" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Student inherits it</text>
  <text x="350" y="210" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">no schema built</text>

  <line x1="350" y1="148" x2="350" y2="170" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Near probe (survives) -->
  <rect x="40" y="260" width="270" height="64" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="175" y="284" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Near-transfer probe</text>
  <text x="175" y="302" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">pattern still applies →</text>
  <text x="175" y="317" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">looks competent</text>

  <!-- Far probe (breaks) -->
  <rect x="390" y="260" width="270" height="64" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="525" y="284" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#C8102E" font-weight="600">Far-transfer probe</text>
  <text x="525" y="302" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">randomness shows →</text>
  <text x="525" y="317" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">pattern-match fails</text>

  <line x1="320" y1="220" x2="200" y2="256" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="380" y1="220" x2="500" y2="256" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <line x1="32" y1="350" x2="668" y2="350" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="372" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">To fake far transfer the student must know which features are surface and which are deep — and that knowledge is the schema.</text>
  <text x="32" y="390" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" letter-spacing="0.04em">THE FAKE REQUIRES THE REAL</text>
  <text x="32" y="408" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Reader takeaway: borrowed certainty is a random board in meaningful clothes — structured from outside, empty under probe.</text>
</svg>
