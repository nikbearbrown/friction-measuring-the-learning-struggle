<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04">
  <title id="fig-title-04">The ethics of process observation</title>
  <desc>A flow showing that identical process data becomes learning support or surveillance depending on purpose, data ownership, and use. Three mitigations keep it on the learning-support path; individual data flowing to administrators crosses the boundary.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="11-building-your-second-evidence-stream" figure-number="04" figure-title="The ethics of process observation" figure-slug="the-ethics-of-process-observation" figure-type="Process flowchart" priority="Important" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/11-building-your-second-evidence-stream-cajal.md"/>
  </metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="32" y="40" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#2a1a0e">Identical data, two destinations — the difference is purpose, not the data</text>

  <!-- Start: data collection -->
  <rect x="32" y="170" width="128" height="60" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="96" y="194" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Process data</text>
  <text x="96" y="210" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">collected on</text>
  <text x="96" y="224" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">students</text>

  <!-- Fork node (perpendicular bar = block) -->
  <line x1="160" y1="200" x2="206" y2="200" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="212" y="172" width="120" height="56" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="272" y="196" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Purpose?</text>
  <text x="272" y="212" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">ownership + use</text>

  <!-- Two paths -->
  <!-- Up: learning support (highlighted) -->
  <line x1="332" y1="186" x2="402" y2="124" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="408" y="88" width="172" height="72" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="494" y="110" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#C8102E">Learning support</text>
  <text x="416" y="128" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">purpose: the student's learning</text>
  <text x="416" y="143" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">data available to the student;</text>
  <text x="416" y="156" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">informs teaching in her service</text>

  <!-- Down: surveillance -->
  <line x1="332" y1="214" x2="402" y2="276" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="408" y="240" width="172" height="72" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="494" y="262" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Surveillance</text>
  <text x="416" y="280" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">purpose: institutional account-</text>
  <text x="416" y="293" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">ability; data flows above the</text>
  <text x="416" y="306" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">student; decisions made about her</text>

  <!-- Mitigations feed the support path -->
  <text x="600" y="88" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Three mitigations</text>
  <line x1="580" y1="110" x2="600" y2="110" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="108" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">transparency</text>
  <text x="600" y="126" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">low stakes</text>
  <text x="600" y="144" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">student agency</text>

  <!-- Boundary line between paths -->
  <line x1="356" y1="200" x2="668" y2="200" stroke="#C8102E" stroke-width="0.75" stroke-dasharray="5 4"/>
  <text x="360" y="216" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#C8102E">surveillance boundary</text>

  <!-- Bottom note -->
  <line x1="32" y1="336" x2="668" y2="336" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="360" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Default: the student sees her own profile; the instructor uses profiles to teach; the institution gets only</text>
  <text x="32" y="378" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">aggregate de-identified data. Individual data flowing to administrators crosses the boundary.</text>
  <text x="32" y="400" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" font-style="italic">Drift toward surveillance (Selwyn) is real but mitigable through design — not automatic, not impossible.</text>
</svg>
