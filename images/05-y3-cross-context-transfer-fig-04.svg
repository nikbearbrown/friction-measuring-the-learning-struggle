<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04">
  <title id="fig-title-04">The two signatures</title>
  <desc>A conceptual map of the genuine versus borrowed-certainty transfer signatures. Genuine learning shows both near and far elevated with a small gap and adaptive expertise. Borrowed certainty shows high near, low far, a large persistent gap, and only routine expertise that reproduces the textbook example.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="05-y3-cross-context-transfer" figure-number="04" figure-title="The two signatures" figure-slug="the-two-signatures" figure-type="Conceptual map" priority="Important" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/05-y3-cross-context-transfer-cajal.md"/>
  </metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="32" y="40" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">The two signatures</text>
  <text x="32" y="60" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Both signatures begin with high near-transfer. What happens to the far score, and the gap, tells them apart.</text>

  <!-- Genuine signature node -->
  <rect x="32" y="92" width="300" height="218" fill="#F5F5F5" stroke="#C8102E" stroke-width="1.5"/>
  <text x="182" y="116" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#C8102E" font-weight="600">Genuine signature</text>

  <rect x="52" y="132" width="260" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="62" y="157" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Near high, far elevated — small gap</text>

  <rect x="52" y="180" width="260" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="62" y="205" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Recognizes principle across disguises</text>

  <rect x="52" y="228" width="260" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="62" y="253" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Generates a new far instance herself</text>

  <text x="182" y="294" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">adaptive expertise</text>

  <!-- Borrowed signature node -->
  <rect x="368" y="92" width="300" height="218" fill="#F5F5F5" stroke="#545454" stroke-width="1.5"/>
  <text x="518" y="116" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Borrowed-certainty signature</text>

  <rect x="388" y="132" width="260" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="398" y="157" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Near high, far low — large, persistent gap</text>

  <rect x="388" y="180" width="260" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="398" y="205" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Treats disguised item as unrelated</text>

  <rect x="388" y="228" width="260" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="398" y="253" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Reproduces the textbook example</text>

  <text x="518" y="294" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">routine expertise</text>

  <line x1="32" y1="340" x2="668" y2="340" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="362" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Far transfer costs something even for genuine learners — so the genuine gap is small, not zero. The borrowed gap does not narrow.</text>
  <text x="32" y="380" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" letter-spacing="0.04em">WORKING THRESHOLDS</text>
  <text x="32" y="398" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Gaps under 15 points probably genuine; 30+ points sustained probably borrowed — practitioner calibration, not a research finding.</text>
</svg>
