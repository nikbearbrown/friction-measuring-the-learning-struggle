  <text x="32" y="40" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">What the research base looks like</text>
  <text x="32" y="60" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Decades of misconception research support the claim that errors have structure; one piece of direct evidence is still owed.</text>

  <!-- Central claim node -->
  <rect x="250" y="178" width="200" height="64" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="350" y="204" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#C8102E" font-weight="600">Errors have structure</text>
  <text x="350" y="221" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">a generator produces</text>
  <text x="350" y="236" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">coherent, codeable errors</text>

  <!-- Supporting evidence nodes around -->
  <rect x="32" y="92" width="180" height="50" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="122" y="113" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">BUGGY (1978)</text>
  <text x="122" y="130" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">errors as procedural bugs</text>

  <rect x="488" y="92" width="180" height="50" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="578" y="113" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Driver (1994)</text>
  <text x="578" y="130" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">misconceptions recur</text>

  <rect x="32" y="278" width="180" height="50" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="122" y="299" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Chi et al. (1981)</text>
  <text x="122" y="316" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">organization, not facts</text>

  <rect x="488" y="278" width="180" height="50" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="578" y="299" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Smith et al. (1993)</text>
  <text x="578" y="316" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">fragments, reorganized</text>

  <!-- mechanism node (bottom center) -->
  <rect x="250" y="300" width="200" height="46" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="350" y="320" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Prediction-error signaling</text>
  <text x="350" y="336" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">supplies the mechanism (1997)</text>

