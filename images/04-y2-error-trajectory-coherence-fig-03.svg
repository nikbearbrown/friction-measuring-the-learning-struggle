  <title id="fig-title-03">What the research base looks like</title>
  <desc>A conceptual map of the empirical foundation for error trajectory coherence: Brown and Burton's BUGGY, Driver's misconception surveys, Chi-Feltovich-Glaser expertise, and Smith-diSessa-Roschelle fragments all support the central claim, while prediction-error signaling supplies the mechanism. The AI-scatter claim remains the open gap.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Friction Measuring the Learning Struggle" book-slug="friction-measuring-the-learning-struggle" chapter="04-y2-error-trajectory-coherence" figure-number="03" figure-title="What the research base looks like" figure-slug="what-the-research-base-looks-like" figure-type="Conceptual map" priority="Critical" author="Nik Bear Brown" date-generated="2026-05-29" source-file="pantry/04-y2-error-trajectory-coherence-cajal.md"/>
