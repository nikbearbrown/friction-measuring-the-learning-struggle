  <line x1="212" y1="300" x2="265" y2="244" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="488" y1="300" x2="435" y2="244" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="350" y1="298" x2="350" y2="246" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- limiting condition / open gap -->
  <text x="350" y="392" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454" letter-spacing="0.04em">LIMITING CONDITION</text>
  <text x="350" y="408" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Direct evidence that AI-assisted errors look scattered is still thin — the structural argument is strong, the confirmation owed.</text>
