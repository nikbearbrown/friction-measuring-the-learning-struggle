  <text x="525" y="314" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">~2× learning vs. active class</text>
  <text x="525" y="334" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">higher engagement to match</text>

  <line x1="32" y1="372" x2="668" y2="372" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="394" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Not "AI hurts learning." The decoupling is the diagnosis; the wrapper is the design lever.</text>
